# SUN-1222C-STORAGE-ALERT-RECEIVER-LOCAL-BUILD
#
# Hosts EXACTLY ONE thing: a `fetch()` handler that authenticates a POST via
# an unguessable URL-path token, validates the existing `StorageAlertPayload`
# shape, and forwards it as a plain-text email over direct authenticated SMTP
# to the operator's own IONOS mailbox
# (`apps/edge-api/src/storage-alert-receiver-entrypoint.ts` +
# `apps/edge-api/src/smtp/ionos-smtp-transport.ts`). This is a FOURTH,
# SEPARATE Cloudflare Worker script -- alongside the public API Worker
# (`wrangler.toml`, `siteborne-utility-edge`), the Workflow host
# (`wrangler.paid-continuation-runtime.toml`,
# `siteborne-paid-continuation-runtime`), and the settlement-alert sweep
# (`wrangler.settlement-alert-worker.toml`, `siteborne-settlement-alert`).
# Deploying THIS config can only ever affect THIS script's own traffic and
# secrets; it cannot touch any other script's deployment membership, D1
# binding, or trigger -- nor any DNS/Email Routing/IONOS mail configuration,
# none of which this Worker touches at all.
#
# Earlier design (superseded, never deployed): Cloudflare Email Routing via
# a `send_email` binding. Abandoned once the operator chose to keep IONOS as
# the sole mail provider for both `siteborne.net` and `siteborne.com` and
# route storage-alert email through an isolated IONOS mailbox instead --
# this Worker now makes an outbound SMTP connection
# (`cloudflare:sockets`, STARTTLS on port 587) rather than using any
# Cloudflare email product, so it requires no `[[send_email]]` block, no
# Email Routing zone state, and no Cloudflare-side destination verification.
#
# Second superseded design (never durably stable): a public Custom Domain
# (`storage-alert.siteborne.net`) plus `workers_dev = true`, invoked over
# public HTTPS by `siteborne-utility-edge`'s generic `buildHttpsWebhookTransport`.
# Retired after repeated, reproduced Custom Domain / DNS disappearance
# incidents in production (multiple `wrangler versions deploy`/`triggers
# deploy` cycles left the domain object and its managed DNS gone with no
# corresponding audited deletion event) and after `wrangler deploy --dry-run`
# was confirmed, via live Cloudflare Audit Logs, to perform a real
# `POST .../subdomain {enabled:true}` side effect despite this file
# declaring `workers_dev = false` and despite `--dry-run` being passed --
# see docs/reports/ for the full forensic timeline. This receiver has no
# structural need to be publicly reachable at all: its only caller is
# another Worker in the same account, which Cloudflare Service Bindings
# (`[[services]]` in `wrangler.toml`, the `siteborne-utility-edge` config)
# serve directly, with no public URL, no DNS record, and no TLS edge
# certificate -- see
# `apps/edge-api/src/control-plane/alerting/storage-alert-service-binding-transport.ts`.
#
# NOT YET DEPLOYED. This file is frozen local configuration only. Before
# `wrangler deploy --config wrangler.storage-alert-receiver.toml`
# may ever run, per SUN-1222C-STORAGE-ALERT-RECEIVER-LOCAL-BUILD's own
# checkpoint text, the following must each be separately authorized and are
# NOT satisfied merely by this file existing:
#   1. `ALERT_PATH_TOKEN` generated (cryptographically random, out-of-band,
#      never committed to this repository) and provisioned via
#      `wrangler secret put ALERT_PATH_TOKEN --config
#      wrangler.storage-alert-receiver.toml`.
#   2. `IONOS_SMTP_PASSWORD` (the `storage@alerts.siteborne.net` mailbox
#      password) provisioned via `wrangler secret put IONOS_SMTP_PASSWORD
#      --config wrangler.storage-alert-receiver.toml` -- NOT YET CREATED.
#      Never a `[vars]` entry, never committed, never logged.
#   3. `siteborne-utility-edge`'s own config (`wrangler.toml`) declaring the
#      `[[services]]` Service Binding to this script, and its
#      `STORAGE_ALERT_PATH_TOKEN` secret provisioned to match this script's
#      `ALERT_PATH_TOKEN` (itself its own separately-gated secret; see
#      `SUN-1222C-STORAGE-RECLAMATION-ALERT-PRODUCTION-DESIGN`).
#
# Non-secret SMTP transport constants (`smtp.ionos.com`, port 587, the
# sender/destination addresses) are deliberately left as plain literals in
# `storage-alert-receiver-entrypoint.ts` rather than duplicated as `[vars]`
# here -- none of them are sensitive, and this Worker has exactly one
# deployment target, so no environment-specific override surface is needed.
name = "siteborne-storage-alert-receiver"
main = "apps/edge-api/src/storage-alert-receiver-entrypoint.ts"
# Matches the other three scripts' compatibility_date -- same runtime
# semantics, same bundling behavior, no independent compatibility-date
# drift across the four scripts.
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]

# This script serves exactly one authenticated path
# (`POST /alert/<ALERT_PATH_TOKEN>`) and nothing else; its own `fetch()`
# handler already returns an identical 404 for every other path/method
# combination (see the entrypoint's own doc comment on why that 404 is
# uniform rather than 401/403/405). Its only caller is
# `siteborne-utility-edge`, reached exclusively via a Cloudflare Service
# Binding (see `wrangler.toml`'s `[[services]]` entry) -- this script is
# therefore internal-only by design and needs no public ingress of any
# kind: no `workers_dev` subdomain, no preview URLs, no routes, no Custom
# Domain. The token-gated path contract is retained anyway as
# defense-in-depth (SUN-1222C-STORAGE-ALERT-RECEIVER-SERVICE-BINDING-MIGRATION),
# not because it is reachable from outside this Cloudflare account.
workers_dev = false

# Wrangler defaults `preview_urls` to the value of `workers_dev` when the
# key is omitted -- with `workers_dev = true` above, that default would let
# every `wrangler versions upload` candidate resolve at a public, unlisted
# preview URL immediately, before any deliberate deployment/promotion.
# Setting this explicitly to `false` keeps every undeployed candidate
# version unreachable; only a later, separately authorized deploy/promotion
# step is meant to make this Worker's traffic publicly reachable.
preview_urls = false

# `ALERT_PATH_TOKEN` and `IONOS_SMTP_PASSWORD` are secrets, deliberately
# absent from this file (never a `[vars]` entry, never committed, never
# logged) -- each provisioned (once separately authorized) via
# `wrangler secret put <NAME> --config wrangler.storage-alert-receiver.toml`.
# Their absence is the expected, safe steady state until that authorization:
# the entrypoint's own `fetch()` handler fails closed (uniform 404 for a
# missing `ALERT_PATH_TOKEN`, 502 with no SMTP connection attempted for a
# missing `IONOS_SMTP_PASSWORD`) -- no crash, no placeholder credential, no
# secret-value disclosure, and critically no "open" auth state.

# Deliberately absent, matching the settlement-alert script's own trust
# boundary: no `[[d1_databases]]`, no `[[r2_buckets]]`, no `[[workflows]]`,
# no `[[queues.producers]]`, no `[ai]` binding, no `[[send_email]]` binding,
# no CDP/facilitator/payment-signing credential of any kind, no `[triggers]`
# cron (this script is purely request-driven). Its total capability surface
# is exactly: read two path/secret-scoped values, validate one fixed JSON
# shape, and open one outbound TCP connection to `smtp.ionos.com:587`.
