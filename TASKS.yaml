      - 'Free live trials, credits trials, time trials, and zero-price live plans remain disabled until after the first unknown external paid purchase'
      - 'Sanitized live evidence records the real sandbox registration, verification, settlement, and public identifiers without claiming production readiness or revenue'
    evidence:
      - 'Checkpoint 1A: exactly one positive-price, non-trial PAYG agent/plan committed and reconciled for web_context_verified.v1 (agentId 37714377069519076502259354421538507339628407587207707299869594618861814144272, planId 94523930722525068656272128894334430057768353189467518442660086462546695282012) — see docs/reports/SUN-0900B-checkpoint-1-fixed-payg-report.md'
      - 'Checkpoint 1A: persisted plan economics independently read back and verified (gross buyer 9000 atomic USDC, seller receiver 0x7f44a2dd237938F18632d4CcA40f4c690295E6E1, platform fee kept distinct, Base Sepolia USDC token, non-trial PAYG)'
      - 'Checkpoint 1A: packages/protocol-nevermined/src/registry-reconciliation.ts makes the live harness idempotent against an already-existing checkpoint registration; 9 credential-free regression tests prove the reuse/fail-closed/timeout/absence invariants'
      - 'Delegation, x402 authorization, verify, service execution, settlement, and replay proof remain outstanding — not yet attempted'
      - 'Checkpoint 1B (fixed PAYG): ACCEPTED. Real settlement #4 (delegation f2c64337-3bb7-4109-a99a-bb3642addffb, tx 0x847a6da0a6a63f1f12838bbe9269b8fd9798997b0680b0146b7147fcb715f417, Payment-Identifier pay_7858b2f7de124dce98395a973eed2208) is REAL_SETTLEMENT/EXTERNALLY_SETTLED/RECOVERED_TO_CONSUMED via a new recovery-only operator path (apps/edge-api/tests/live/nevermined-recover-operator.test.ts, pnpm nevermined:recover), never RUN_LIVE_NEVERMINED-gated, seller-side GET-only reconciliation, zero new delegation/token/verify/execute/settle/job — see docs/reports/SUN-0900B-checkpoint-1-fixed-payg-report.md.'
      - 'Checkpoint 2A (dynamic document capability + registration): credential-free architecture and proof complete, NOT accepted as a live proof. Classification remains DYNAMIC_PAYG_REQUIRES_CONTROLLED_SANDBOX_PROOF (installed SDK positively confirms isRedemptionAmountFixed=false as its own PAYG default and a distinct verify-time vs settle-time maxAmount, but no live settle(actual<max) call has ever been made). D1 already represents authorized_maximum/actual_amount additively with no new migration. registration_allowed=false this turn (plan price-field economics for the ceiling-vs-actual model unresolved) — read-only discovery found NO_MATCH (only the existing web_context_verified.v1 agent/plan exist); no document agent/plan was registered. Credential-free acceptance matrix items A-K proven (3 new pricing tests for 12000/19000/29000, 1 new durability-before-settle test) — see docs/reports/SUN-0900B-checkpoint-2-dynamic-document-report.md.'
      - 'Checkpoint 2B (differential PAYG unit-economics probe): DEFINITIVE for the probed configuration. One controlled sandbox capability probe reused the already-accepted web_context_verified.v1 plan (never document_evidence_json.v1): verified maxAmount 9000 (the plan ceiling), then deliberately settled maxAmount 1000. Real on-chain result (tx 0x59a8bd0b7567e7cf3cc2489c539e41083ba424bd87d1b2920d539eebcd9669d7): gross transfer was 9000, not the requested 1000 -- the plans registered price dominated settlement, not the settle-time maxAmount. Classification (refined): PAYG_ACTUAL_BELOW_PRICE_UNSUPPORTED_FOR_PROBED_CONFIGURATION -- scoped to the getPayAsYouGoPriceConfig/getPayAsYouGoCreditsConfig pairing actually tested, not generalized to all PAYG plans under every configuration. registration_allowed=false for that pairing. Fixed-PAYG (exact scheme) plans are unaffected since actual has always equaled price there by construction. See docs/reports/SUN-0900B-checkpoint-2b-unit-economics-report.md.'
      - 'Checkpoint 2C (dedicated dynamic-credits mechanism audit): static/read-only, zero Nevermined calls. Confirmed installed getDynamicCreditsConfig(creditsGranted, minCreditsPerRequest=1n, maxCreditsPerRequest=1n) is a 3-parameter signature (differs from the 2-parameter shape current public docs show). Proved getPayAsYouGoCreditsConfig() is byte-identical to getDynamicCreditsConfig(1n,1n,1n) -- PAYG is a degenerate single-credit case of dynamic, not a distinct mechanism, explaining Checkpoint 2Bs result. Traced registerPlan/registerCreditsPlan: a thin HTTP client with zero local transformation between priceConfig and creditsConfig (two synchronous pre-network guards confirmed: durationSecs must be 0, minAmount must not exceed maxAmount). The actual credits-to-currency mapping for a dynamic config is enforced entirely server-side and is NOT locally determinable. Classification: DYNAMIC_MODEL_UNPROVEN (leaning toward a prepaid-credit-pool hypothesis given the SDK bundled READMEs MCP credits abstraction, but not proven). 7 new credential-free tests added. registration_allowed=false, sandbox_capability_verified=false, dynamic_live_allowed=false, all unchanged. Next falsification probe designed but not run -- see docs/reports/SUN-0900B-checkpoint-2c-dynamic-credits-mechanism-report.md.'
      - 'Checkpoint 2D (genuine dynamic-credits sandbox falsification probe): PROVEN. One sacrificial capability-probe agent/plan (SITEBORNE Dynamic Credits Capability Probe, never document_evidence_json.v1) registered with getDynamicCreditsConfig(9000n,1000n,9000n) + getERC20PriceConfig(9000n,...). Read-only getPlanBalance confirmed pricePerCredit=0.000001 (exactly 1 atomic USDC per credit) before any settlement. One real verify(9000) + one real settle(1000): settle response creditsRedeemed=1000, remainingBalance=8000 (exactly 9000-1000). Real on-chain transfer (tx 0xe0a6932e33eb6e4dc0eaeca5e7c51dc0899a2212c45781f4d877b8f3399d36ca) was 9000 atomic USDC, an automatic plan-purchase/top-up (split 8910/90), not 1000 -- the requested 1000 was burned off-chain from the freshly-purchased 9000-credit pool. Classification: PREPAID_DYNAMIC_CREDITS_SUPPORTED (matrix item B), proven per the mandatory acceptance bar (actual balance exists, 9000 acquired, 1000 redeemed, 8000 remain, 1:1 atomic mapping confirmed). document registration_allowed/sandbox_capability_verified/dynamic_live_allowed remain false -- this probes success does not by itself authorize document registration; that is a separate product/master-directive compatibility decision. Probe registration retained (not deleted) as audit evidence. See docs/reports/SUN-0900B-checkpoint-2d-dynamic-credits-live-probe.md.'
      - 'Checkpoint 2E (document prepaid-credit contract decision): zero external mutation, decision only. Answered the central normative question as MODEL C -- rail-specific payment semantics -- citing ADR 0054 (already-accepted Model D: UsageResult/PCC/receipt remain rail-agnostic, PaymentServiceLink is rail-aware) and ExternalSettlementEvidence.actual_amount own frozen definition (tied to the usage-result binding, not literal cash). Product decision: A, NEVERMINED_PREPAID_DYNAMIC_ACCEPTED -- the prepaid-credit model proven in Checkpoint 2D is normatively compatible with the frozen document contract and Model D. No UsageResult/PCC/PaymentServiceLink schema or version change required -- only a new additive Nevermined-specific settlement-evidence object shape (credits_redeemed/usage_value_atomic/remaining_balance/cash_movement_atomic), hashed into the existing settlement_evidence_hash field. registration_allowed remains false this turn (the decision authorizes building the registration validator in a later checkpoint, not registering now); sandbox_capability_verified/dynamic_live_allowed remain false. Auto-top-up behavior at partial (non-zero, insufficient) balance remains an open question, marked for a future live acceptance test, not guessed. See docs/reports/SUN-0900B-checkpoint-2e-document-economic-model-decision.md.'
      - 'Checkpoint 2F (document dynamic-credit registration validator): credential-free validator and reconciliation boundary complete. Authoritative GET read-back is fail-closed across service endpoint/name, exact agent-plan linkage, persisted 99/1 seller/platform price components totaling 190000 atomic Base Sepolia USDC, 190000 granted credits, variable 12000-190000 redemption, credits-only/non-trial/non-recurring/non-time-based fields, and exact BigInt 1:1 acquisition value. PAYG 1/1/1, fixed, wrong economics/asset/receivers/service, malformed numbers/shapes, and ambiguous reconciliation are rejected. registration_allowed=true now means only that one exact registration attempt is structurally safe; sandbox_capability_verified=false and dynamic_live_allowed=false remain unchanged. No document registration or lifecycle mutation occurred. See docs/reports/SUN-0900B-checkpoint-2f-document-registration-validator.md.'
      - 'Checkpoint 2G (document dynamic-credit registration): ACCEPTED. Builder-only reconciliation proved NO_MATCH (0 matching agents, 0 matching plans) before exactly one guarded registerAgentAndPlan attempt. The frozen document registration is agentId 109760621961288696094411057321700210583752765344624386042713081041578011828571 and planId 64977106381472769302826211192910538031161833107493020584806963732279386695975. Authoritative GET read-back passed validateNeverminedDocumentDynamicPlan and reconciled EXACT_EXISTING: exact POST endpoint/linkage, 188100 seller + 1900 platform = 190000 atomic Base Sepolia USDC, 190000 credits, variable 12000-190000 redemption, non-trial/non-recurring credits access, and exact BigInt 1:1 acquisition value. Registration is frozen; no second registration is necessary. Delegation/token/verify/execute/settle/Payment-Identifier/job/payment calls remained zero. registration_allowed=true and registered=true; sandbox_capability_verified=false and dynamic_live_allowed=false remain unchanged. See docs/reports/SUN-0900B-checkpoint-2g-document-registration.md.'
      - 'Checkpoint 2H (real zero-balance document prepaid-credit lifecycle): ACCEPTED for the frozen native zero-credit path. One controlled sandbox lifecycle used Payment-Identifier pay_3fa17794e1ed47589d64e3db3c15e09a and delegation 7045d724-0a61-4190-b5de-dee3bba185ac. Real verifyPermissions succeeded once, the document service executed once with actual UsageResult 12000, PCC and signed receipt were generated and self-verified before settlement, and SETTLEMENT_PENDING was durable before the one settlePermissions call. The provider settled externally but the live wrapper rejected an ambiguous immediate observation, so the same persistent D1 payment was recovered without another delegation/token/verify/execute/settle/job. Seller GET-only reconciliation plus Base Sepolia receipt 0xb714bf0dd56603435e4aae0b4136ad1338d7f98b2fced3bfdc463c4e413ad4d3 proved one 190000-atomic acquisition (188100 seller + 1900 platform), 190000 credits acquired, exactly 12000 redeemed, and 178000 remaining. PSL v2 self-verified, the same payment became consumed, a fresh-process reopen reconstructed it with zero additional work/provider calls, and changed binding returned replay_conflict. sandbox_capability_verified=true and dynamic_live_allowed=true are scoped only to this frozen zero-credit native lifecycle. PARTIAL_POSITIVE_INSUFFICIENT_BALANCE_UNPROVEN remains explicit. See docs/reports/SUN-0900B-checkpoint-2h-document-zero-balance-lifecycle.md.'
      - 'Checkpoint 2I (positive-but-insufficient document balance): ACCEPTED. The first OCR-disabled payment pay_f9cfc34bac0d46bc980d71b286bf39a6 remains an immutable fail-closed verified/REJECTED incident with zero provider transactions or settlement. After a committed OCR/input-boundary repair, one new corrected payment pay_889841069efe4410908ed76a7c1ad18c started at 178000 credits and measured a real ten-page OCR UsageResult of 190000. Real verifyPermissions and service execution each occurred once; PCC and the Ed25519 receipt passed before durable SETTLEMENT_PENDING. Real settlePermissions occurred once. The provider succeeded externally while the local immediate-observation gate failed closed; same-payment seller GET/on-chain recovery added zero verify/execute/settle/jobs. Base Sepolia tx 0xbc3693feca26bfc9282e3e0c746123d89f45e40dbb9b42679567426e97d46aa4 proves a full 190000-atomic acquisition (188100 seller + 1900 platform), 190000 credits acquired/redeemed, and 178000 ending credits. Classification: PARTIAL_POSITIVE_INSUFFICIENT_BALANCE_PROVEN=true, FULL_BUNDLE_TOPUP. PSL v2 verified, consumed state persisted, credential-free fresh-process replay added zero work/provider calls, and changed binding returned replay_conflict. See docs/reports/SUN-0900B-checkpoint-2i-document-partial-balance.md.'
      - 'Checkpoint 2J (company evidence registration): ACCEPTED. Builder-only reconciliation proved authoritative NO_MATCH across six bounded passes (0 matching agents and 0 matching plans) before exactly one guarded registerAgentAndPlan mutation. The frozen company registration is agentId 63058244394774357835944659628164807563769006924765007721830897155339294179447 and planId 61176543225966665382887590264143689398477975837289843272089835781341158489584. Authoritative GET read-back passed validateNeverminedFixedPaygPlan and reconciled EXACT_EXISTING: exact agent/plan identity, one canonical POST endpoint, exact linkage, 38610 seller + 390 platform = 39000 atomic Base Sepolia USDC, PAYG credits 1/1/1, credits access, non-trial, non-recurring, and no document dynamic-credit configuration. Delegation/token/verify/execute/settle/Payment-Identifier/job/payment/USDC-movement totals remained zero. See docs/reports/SUN-0900B-checkpoint-2j-company-registration.md.'
      - 'Checkpoint 2K (verify-agent-output registration): ACCEPTED. Builder-only reconciliation proved authoritative NO_MATCH across six bounded passes (0 matching agents and 0 matching plans) before exactly one guarded registerAgentAndPlan mutation. The frozen verify registration is agentId 75096875289866166059253207097165867959384005104090226106621988801798698661167 and planId 106105151389083481380363516765690985250481102170794631056207896452064676707220. The reused credential-independent fixed-PAYG validator passed authoritative GET read-back and final reconciliation returned EXACT_EXISTING: exact identity/POST endpoint/linkage, 18810 seller + 190 platform = 19000 atomic Base Sepolia USDC, PAYG credits 1/1/1, credits access, non-trial, non-recurring, and explicit rejection of document dynamic credits. Delegation/token/verify/execute/settle/Payment-Identifier/job/payment/USDC-movement totals remained zero. See docs/reports/SUN-0900B-checkpoint-2k-verify-registration.md.'
      - 'Checkpoint 2L (final completeness audit): ACCEPTED. Builder-only exhaustive GET pagination found 5 published agents and 5 plans: exactly one authoritative canonical agent/plan pair for each of the four services plus one clearly segregated dynamic capability probe. All four frozen IDs passed their accepted authoritative validators and reconciled EXACT_EXISTING with zero duplicate canonical registrations. The eight normative SUN-0900B acceptance tests all pass; the accepted web lifecycle generalizes the shared fixed-PAYG provider mechanism to the registered company/verify declarations, while the document zero-balance and positive-insufficient lifecycles prove prepaid dynamic credits and FULL_BUNDLE_TOPUP. This audit made zero registrations, delegations, tokens, verification, service, settlement, payment, job, or USDC mutations. See docs/reports/SUN-0900B-final-completeness-audit.md.'
    next_action: 'ACCEPTED. The Nevermined sandbox rail is frozen infrastructure: four canonical positive-price non-trial registrations, fixed-PAYG live settlement/recovery, document prepaid-credit zero-balance and FULL_BUNDLE_TOPUP lifecycles, authoritative D1 replay, Model D, and secret boundaries are proven. No additional Nevermined sandbox payment or registration is required for SUN-0900B. SUN-1000 is the next dependency-ready serial frontier; do not begin it without a separate directive. Production remains disabled and not ready.'
