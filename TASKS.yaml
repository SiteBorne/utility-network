    rubric_target: 85
    acceptance_tests:
      - 'Nevermined sandbox builder and controlled subscriber identities are configured without committing credentials'
      - 'Four positive-price, non-trial PAYG plans are created and bound to the four canonical SITEBORNE services'
      - 'Live entitlement verification succeeds and rejects invalid entitlement before service execution'
