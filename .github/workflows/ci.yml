name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Governance validation
        run: pnpm governance:validate

      - name: State validation
        run: pnpm state:validate

      - name: Tasks validation
        run: pnpm tasks:validate

      - name: PCC schema generation drift check
        run: pnpm pcc:generate:check

      - name: Service input-validator generation drift check
        run: pnpm schemas:check

      - name: Service metadata generation drift check
        run: pnpm services:generate:check

      - name: OpenAPI generation drift check
        run: pnpm openapi:generate:check

      - name: Embedded pricing drift check (governance/RISK_LIMITS.yaml)
        run: pnpm pricing:check

      # Deliberately NOT wired in as a hard gate yet: `pnpm pricing:registry:check`
      # (scripts/check-registry-pricing-drift.mts) currently fails for real,
      # already-tracked reasons -- registry/services/company_evidence_graph.{v1,v2}.json's
      # `maximum_price` (0.19) doesn't match governance's flat $0.039 ceiling for
      # that family. The real charged amount is unaffected (every quote-minting
      # call site reads governance/RISK_LIMITS.yaml live, never this display-only
      # field) -- but correcting the registry JSON is itself classified a MAJOR,
      # backward-incompatible contract change by `contracts:compat:check` (the
      # value is part of the frozen `metadata/company_evidence_graph.v2.json`
      # release snapshot), which needs its own explicit, standalone governance
      # authorization and a version bump -- out of scope for a repo-only CI-gate
      # checkpoint. See docs/reports/SUN-1222B-S3-CONTINUE-four-service-commercial-freeze.md
      # §21/§28. Add this step back once that dedicated remediation lands.

      - name: Contract frozen-baseline verification
        run: pnpm contracts:baseline:verify

      - name: Contract compatibility check
        run: pnpm contracts:compat:check

      - name: Contract release verification
        run: pnpm contracts:release:verify

      - name: D1 migration verification
        run: pnpm migrations:verify

      - name: Production configuration preflight (offline)
        run: pnpm production:preflight --config-only

      - name: Adapter checks (format, lint, typecheck, tests, property tests, fixtures, manifests)
        run: pnpm adapters:check

      - name: Verification mesh checks (format, lint, typecheck, tests, property tests, fixtures, policy)
        run: pnpm verification:check

      - name: Service runtime checks (format, lint, typecheck, tests, property tests, fixtures)
        run: pnpm services-runtime:check

      - name: x402 protocol checks (format, lint, typecheck, tests, property tests, fixtures)
        run: pnpm x402:check

      - name: MCP protocol checks
        run: pnpm mcp:check

      - name: A2A protocol checks
        run: pnpm a2a:check

      - name: Nevermined protocol checks
        run: pnpm nevermined:check

      - name: Real workerd and Wrangler dry-run release harness
        run: pnpm test:worker-runtime

  python-validate:
    name: Validate (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          cd services/modal-worker
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]" -e ".[modal]"

      - name: Ruff
        run: |
          cd services/modal-worker
          .venv/bin/ruff .

      - name: Mypy
        run: |
          cd services/modal-worker
          .venv/bin/mypy .

      - name: Pytest
        run: |
          cd services/modal-worker
          .venv/bin/python -m pytest

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: detect --source="." --verbose --redact

  security-release:
    name: Security Release Gate (Semgrep, OSV-Scanner, Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap pinned scanners (Semgrep, OSV-Scanner, Trivy)
        run: pnpm security:bootstrap

      - name: Run release security gate
        run: pnpm security:release
        # SUN-1000 checkpoint 1B: this job runs the real scanners and
        # reports genuinely (never swallowed) — it is deliberately NOT
        # yet in `check`'s `needs` list, since real, evidenced,
        # not-yet-remediated dependency findings exist today (see
        # docs/reports/SUN-1000-checkpoint-1b-security-scanner-integration.md).
        # Wiring it as a hard merge-blocking requirement is the explicit
        # next checkpoint, once that remediation lands — not silently
        # weakened here, just deliberately scoped out of this one.

  check:
    name: All Checks Passed
    needs: [validate, python-validate, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.validate.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.python-validate.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.secret-scan.result }}" != "success" ]]; then exit 1; fi
          echo "All checks passed"
