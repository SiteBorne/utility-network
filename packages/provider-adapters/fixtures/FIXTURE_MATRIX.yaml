# SITEBORNE Utility Network — SUN-0300 Fixture Behavior Matrix
#
# Normative coverage inventory: one row per tested behavior. Each row is
# cross-checked by `pnpm --filter @siteborne/provider-adapters run
# fixtures:verify` (scripts/verify-fixture-matrix.ts), which fails the build
# if:
#   - a scenario_id is duplicated;
#   - expected_result_class is not one of the closed AdapterResultClass values
#     (or the literal "n/a" for rows that assert below the execute() level);
#   - a referenced fixture file does not exist;
#   - a referenced test_file does not exist, or does not contain an `it(...)`
#     whose title includes test_anchor.
#
# This matrix is grounded in tests that exist today. Rows are not added ahead
# of their test — see docs/reports/SUN-0300-public-data-adapters-report.md for
# the categories from the original completion-plan list that are not yet
# covered by an executable test.

