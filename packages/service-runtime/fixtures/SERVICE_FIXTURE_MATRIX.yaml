# Service fixture matrix (SUN-0600, closure pass).
#
# Each row documents one distinct, executable test scenario. Because these
# services depend on injected adapters/worker bridges (not pure
# JSON-in/JSON-out functions like the SUN-0500 mesh), scenario *execution*
# lives in the referenced test files, not as data-driven YAML alone — this
# file is the traceable, human-readable index. scripts/verify-fixtures.ts
# additionally executes a representative subset of these scenarios directly
# (the `executed_by_script: true` rows) as its own regression gate, and
# fails if any of those drift from the documented result_class; the
# remaining rows are covered by their referenced vitest file, which
# `pnpm services-runtime:test` already runs on every check.
#
# There is no minimum row-count target. This matrix reflects actual
# behavior coverage, not an arbitrary count — see
# docs/reports/SUN-0600-local-services-report.md's coverage audit for the
# explicit list of source-directive scenarios NOT covered here (and why).

