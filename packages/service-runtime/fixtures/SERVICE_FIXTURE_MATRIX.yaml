# Service fixture matrix (SUN-0600).
#
# Each row documents a scenario exercised by scripts/verify-fixtures.ts.
# Because these services depend on injected adapters/worker bridges (not
# pure JSON-in/JSON-out functions like the SUN-0500 mesh), the actual
# scenario *execution* lives in TypeScript
# (scripts/verify-fixtures.ts::SCENARIOS), not as data-driven YAML alone —
# this file is the traceable, human-readable index cross-checked against
# that scenario list by the script itself (fails if a scenario_id here has
# no matching TS scenario, or vice versa).

fixtures:
  - scenario_id: company-identity-exact-cik-sec-submissions
    service_id: company_evidence_graph.v1
    category: identity_and_source_composition
    dependency_fixtures: [packages/provider-adapters/fixtures/sec-edgar/submissions-success.json]
    expected_result_class: success
    expected_receipt_valid: true
    test_reference: src/services/company-evidence/service.test.ts

  - scenario_id: company-no-identity-signal-rejected
    service_id: company_evidence_graph.v1
