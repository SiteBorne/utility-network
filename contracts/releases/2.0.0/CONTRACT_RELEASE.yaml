release:
  name: 'SITEBORNE Service Contracts'
  version: '2.0.0'
  status: 'normative'
  frozen_at: '2026-08-17T06:00:00Z'
  source_commit: 'pending'
  parent_release: '1.0.1'
  classification: 'major'
  reason: >-
    SUN-1000 checkpoint 1M implementation of the checkpoint 1K-B/1L frozen
    architectural decision (CONTRACT_2_AND_SERVICE_V2_REQUIRED,
    PREPRODUCTION_V2_REPLACEMENT coexistence model). Defect B (the
    StructuredError 400/402 response-schema mismatch — checkpoint 1J
    section 10) is corrected by replacing the incorrect StructuredError
    $refs on the four per-service 400/402 responses with the two real,
    runtime-accurate response schemas (ValidationError, matching
    apps/edge-api/src/control-plane/routes/x402-service.ts's jsonError();
    PaymentRequiredChallenge, matching its CDP-rail x402 PAYMENT-REQUIRED
    challenge body). Per docs/contracts/COMPATIBILITY_POLICY.md section 4
    (error_contract_changed: major, Parallel Major Required: Yes), section
    3.3, and section 12's approval table, this requires both a new Service
    Contract Release major (2.0.0) and new Service API major identities
    (.v2) for all four affected services — the raw checker classification
    below is genuinely MAJOR, not overridden by human review (unlike
    checkpoint 1K-A's defect-A PATCH_REPAIR, defect B has no
    never-validly-resolvable carve-out: StructuredError is a real,
    resolvable schema). Request and success-response schemas are
    byte-identical to their v1 counterparts (unchanged semantics per
    checkpoint 1L section 7); pricing is byte-identical
    (SAME_ECONOMICS_NEW_SERVICE_MAJOR, checkpoint 1L section 9). v1
    (contracts/releases/1.0.0, 1.0.1) remains permanently frozen and
    unmodified — this release does not repoint or retire the .v1
    identity, it introduces .v2 as the new active/forward contract per the
    PREPRODUCTION_V2_REPLACEMENT model (all four .v1 operations already
    declared x-implementation-status:not_implemented/
    x-production-enabled:false, so no external promise of v1 availability
    is broken). The PCC schema also advances 1.0.1 -> 1.1.0 (minor,
    service_id enum gains the four .v2 members — classified
    minor-compatible per packages/pcc-schema/policy/COMPATIBILITY.md
    sections 1/4, a separate, PCC-specific governing policy distinct from
    this document's own service-contract-release taxonomy; PCC document
    version pcc_version remains 1.0.0, unchanged).

