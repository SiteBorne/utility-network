[project]
name = "siteborne-modal-worker"
version = "0.1.0"
description = "Modal worker for document processing and heavy computation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=0.70",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "docling>=2.8",
    "pymupdf>=1.23",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "tesseract>=0.1",
    "ocrmypdf>=15.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.0",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rfc8785>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "hypothesis>=6.99",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "hypothesis>=6.99",
    "rfc8785>=1.0",
]

[tool.modal]
app_name = "siteborne-utility-worker"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true