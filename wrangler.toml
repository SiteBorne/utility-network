name = "siteborne-utility-edge"
# SUN-0800B checkpoint 2: corrected from `src/index.ts` (a path that does
# not exist anywhere in this repository -- no top-level `src/` at all).
# The originally-configured custom `[build]` command (now removed, see
# below) pointed `main` at its expected OUTPUT, but
# `apps/edge-api/tsconfig.json` has `"noEmit": true` -- it is a
# typecheck-only config, by design, and running `tsc` against it emits
# no files at all (confirmed live: `pnpm run build` in that package
# reports success but `dist/` never exists). The custom build command
# was consequently broken from the moment it was added -- no successful
# deploy could ever have used it. The correct, standard pattern for a
# TypeScript Cloudflare Worker is to point `main` directly at the
# TypeScript source and let wrangler's own esbuild-based bundler compile
# it at deploy time (handling the workspace-linked `@siteborne/*`
# package imports, ESM output, etc. itself) -- confirmed live:
# `wrangler deploy --dry-run` succeeds through the build/bundle stage
# with this fix, reaching only the (expected, credential-gated) account
# authentication step.
main = "apps/edge-api/src/index.ts"
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]

# SUN-1100 checkpoint 2: adding `routes` below silently disabled the
# `workers.dev` preview URL by default (wrangler's own documented behavior
# once any `routes` entry exists and `workers_dev` is not explicitly set) --
# confirmed live: https://siteborne-utility-edge.siteborneutilitynetwork.workers.dev
# regressed from 200 (SUN-0800B checkpoint 3 evidence) to 404 immediately
# after this checkpoint's first `routes` deploy. Restored explicitly; this
# was never an intended change.
workers_dev = true
# SUN-1207 M3: undeployed Worker versions can inherit production secrets and
# stale version-scoped variables. Versioned and aliased preview URLs must never
# make those versions publicly routable. Keep the normal workers.dev surface
# above; disable only per-version/per-alias previews.
preview_urls = false

# SUN-1100 checkpoint 2: a narrowly-scoped Worker Route (not a full custom
# domain) for exactly one path on the apex zone -- proves domain control to
# the MCP Registry's HTTP domain-authentication mechanism
# (https://modelcontextprotocol.io/registry/authentication#http-authentication)
# without binding the whole `siteborne.net` apex to this Worker. The apex's
# existing DNS record (Cloudflare-proxied, no valid origin behind it --
# confirmed live, HTTP 525) is untouched; a Worker Route intercepts only this
# exact path before it would ever reach that non-existent origin. Reversible:
# removing this array un-registers the Route on the next deploy. Must be a
# top-level key (before any `[section]` table header) -- placing it after
# `[queues]` silently nested it inside that table instead (caught by
# wrangler's own "Unexpected fields found in queues field: routes" warning
# during this checkpoint's dry-run).
routes = [
  { pattern = "siteborne.net/.well-known/mcp-registry-auth", zone_name = "siteborne.net" }
]

# [vars] values are plaintext: committed to this file, visible in git
# history, and shown unredacted in the Cloudflare dashboard. Only
# genuinely non-secret configuration belongs here.
#
# SUN-0800B checkpoint 2: `ENVIRONMENT`/`LOG_LEVEL` moved here from a
# bare `[env]` table (removed), which is not a valid top-level construct
# in wrangler's schema (named environments are `[env.<name>]`) -- the
# values were being silently dropped, confirmed live: `wrangler deploy
# --dry-run`'s own binding listing showed only `PCC_VERSION`, never
# `ENVIRONMENT`/`LOG_LEVEL`. `apps/edge-api/src/control-plane/config/
# env.ts` treats both as required `Env` fields but falls back to
# `'development'`/`'info'` if absent -- meaning a real deployment would
# have silently run as `ENVIRONMENT=development` in production, never as
# configured here.
[vars]
PCC_VERSION = "1.0.0"
ENVIRONMENT = "production"
LOG_LEVEL = "info"
AGENT_CARD_SIGNING_KEY_ID = "siteborne-agent-card-2026-08"
# SUN-1205 checkpoint K (§3, production preflight finding): required
# alongside NVM_API_KEY/NEVERMINED_API_KEY by resolveNeverminedConfig --
# must be exactly "sandbox"; "live" is explicitly, permanently rejected
# by that function regardless of what is set here (the standing
# Nevermined-live hard-disable, unrelated to and unaffected by
# PAYMENT_ENVIRONMENT below, which governs the CDP rail only). Not a
# secret: a fixed literal, never credential material.
NVM_ENVIRONMENT = "sandbox"
# SUN-1205 checkpoint K completion: the five payment/cutover switches that
# appeared in partial commit 7a62d4b were a previously-transient cutover diff,
# accidentally committed while still set to their activating values. They are
# deliberately absent from the frozen pre-upload candidate. Every consumer is
# fail-closed on absence: CDP resolves to preproduction/disabled, and the paid
# route families return 404. A later, separately authorized cutover must set
# the exact bounded values it needs in its own reviewed commit/version; an
# upload of this candidate cannot activate paid routes or authorize economics.
# SUN-1200 checkpoint E: the canonical production payment-receiving
# address, confirmed by the user and independently reconciled read-only
# against the real CDP account list (cdp.evm.getAccount /
# cdp.evm.listAccounts, both real read-only calls, zero mutation) --
# never inferred or substituted by this agent. Public receiving address,
# not credential material -- belongs in [vars], not the secret store.
# Presence here alone changes no economic behavior: production payment
# execution still requires all four ADR 0055 gates
# (PRODUCTION_ENABLED/HUMAN_AUTHORIZED_PRODUCTION_BOOTSTRAP/
# PRODUCTION_CDP_CREDENTIALS_APPROVED/PAYMENT_ENVIRONMENT=production),
# none of which are set here or anywhere in this deployment.
SELLER_WALLET_ADDRESS = "0x7f44a2dd237938F18632d4CcA40f4c690295E6E1"

# The following are real secrets/credentials (SUN-0700B, SUN-0400B) and
# must NEVER be added to [vars] above or committed anywhere in this
# repo. Provision each with `wrangler secret put <NAME>` (encrypted,
# stored by Cloudflare, never written to this file) for the deployed
# Worker, or in a local, gitignored `.dev.vars` file
# (see .gitignore) for `wrangler dev`. Both populate the same
# `env.<NAME>` binding apps/edge-api/src/control-plane/config/env.ts
# expects — this file intentionally declares no placeholder/empty
# entries for them, so an accidental real value pasted here is never
# possible by construction. Exact names:
#   CDP_API_KEY_ID          - Coinbase CDP API key ID (@coinbase/cdp-sdk's
#                             own default env var name)
#   CDP_API_KEY_SECRET      - Coinbase CDP API key secret (ditto)
# (SELLER_WALLET_ADDRESS moved to [vars] above, SUN-1200 checkpoint E --
# it is a public receiving address, not credential material.
# CDP_WALLET_SECRET removed entirely, same checkpoint -- not required by
# either the facilitator client or the read-only seller getAccount
# lookup; see production-payment.ts's own reconciliation comment.)
#   NVM_API_KEY             - Nevermined API key (canonical name; the
#                             deprecated NEVERMINED_API_KEY alias is also
#                             still accepted -- see env.ts)
#   VOYAGE_API_KEY          - Voyage AI API key
#   MODAL_TOKEN_ID          - Modal deployment token ID (SUN-0400B)
#   MODAL_TOKEN_SECRET      - Modal deployment token secret (SUN-0400B)
#   SENTRY_DSN              - Sentry error-reporting DSN
#   AGENT_CARD_SIGNING_PRIVATE_KEY - ES256 JWK private key material for
#                             A2A Agent Card signing (SUN-0800B checkpoint
#                             2), paired with AGENT_CARD_SIGNING_KEY_ID in
#                             [vars] above -- see env.ts's doc comment
#                             (both or neither; a partial pair fails
#                             closed to the ephemeral dev identity).
# SUN-1205 checkpoint K: this list was stale (omitted NVM_API_KEY under
# its canonical name and AGENT_CARD_SIGNING_PRIVATE_KEY entirely) --
# discovered via `pnpm production:preflight`'s real `wrangler secret
# list` read against the actual target account, corrected here.
# See docs/operations/CLOUDFLARE_PROVISIONING_CHECKLIST.md.

[[d1_databases]]
binding = "DB"
database_name = "siteborne-utility"
database_id = "efe23c42-cbcc-47c2-9b28-922a541bdcdd"

# SUN-0800B checkpoint 3: R2 bucket commented out - needs dashboard enablement first
# [[r2_buckets]]
# binding = "ARTIFACTS"
# bucket_name = "siteborne-artifacts"

# SUN-0800B checkpoint 2: `id` cannot be a placeholder/empty string --
# wrangler rejects that as an invalid string id (unlike `d1_databases`'
# `database_id`, which tolerates an empty string and is left as-is
# above). A real KV namespace id can only come from an actual
# provisioned Cloudflare namespace (`wrangler kv namespace create
# CATALOG`, a real external mutation this checkpoint does not perform).
# `CATALOG` is not in `env.ts`'s `requiredBindings` list, so the binding
# being absent locally does not break anything today. Uncomment with the
# real id once the namespace is provisioned (see the external unblock
# checklist in docs/reports/SUN-0800B-checkpoint-2-license-signing-external-unblock.md).
[[kv_namespaces]]
binding = "CATALOG"
id = "59dc955c3ebf4208a882f82d8d8fab30"

# SUN-0800B checkpoint 2: corrected from a stale `[[queues]]` array-of-
# tables shape (invalid under the current wrangler queues schema, which
# is confirmed live at developers.cloudflare.com/queues/configuration/)
# to the current `[queues]` single-table `producers` shape. This Worker
# (apps/edge-api/src/index.ts) exports only a fetch handler -- no
# `queue()` handler -- so it is producer-only for both queues; there is
# no `consumers` array to declare here.
[queues]
producers = [
  { queue = "siteborne-jobs", binding = "JOBS" },
  { queue = "siteborne-events", binding = "EVENTS" },
]

# SUN-1221E6R-H2AWI-4R/4P -- durable paid-continuation orchestrator (H2AW
# design, commit 21d11ab). `class_name` must be exported from `main`
# (`apps/edge-api/src/index.ts` re-exports it for exactly this reason).
# The Workflow resource is a *trigger*-class resource (like routes/cron),
# registered via `PUT /accounts/{id}/workflows/{name}` -- but that call is
# only issued by `wrangler triggers deploy`, NOT by `versions upload` or
# `versions deploy` (confirmed by reading wrangler's own source, and by a
# real `workflow.not_found` after deploying a version with this binding
# but before running `triggers deploy`). Run `wrangler triggers deploy`
# once after any change to this block, in addition to a normal version
# upload/deploy.
[[workflows]]
name = "siteborne-paid-continuation"
binding = "PAID_CONTINUATION_WORKFLOW"
class_name = "PaidContinuationWorkflow"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[observability]
enabled = true

# SUN-0800B checkpoint 2: the previous custom `[build]` command (`pnpm
# run build --filter=edge-api`, itself also wrong -- no package is named
# `edge-api`, only `@siteborne/edge-api`) is removed entirely. It was
# never functional: even corrected to the right filter, it invoked
# apps/edge-api's own `build` script, which runs `tsc` against a
# `noEmit: true` tsconfig and produces no output for `main` to point at
# (see the comment on `main` above). No `[build]` section is needed --
# wrangler bundles `main`'s TypeScript source directly with its own
# esbuild-based bundler, the standard pattern for a Workers project.
