title = "Gitleaks configuration for SITEBORNE Utility Network"

# CRITICAL: without [extend], a gitleaks config file that defines no
# [[rules]] of its own runs with ZERO detection rules — only the
# [allowlist] below, which allowlists nothing when there is nothing to
# match against. This file previously omitted [extend] entirely, so
# every `pnpm secrets:scan` / CI gitleaks run silently detected nothing
# at all (verified directly: a synthetic GitHub PAT and Slack bot token
# were NOT flagged with the old config, but WERE flagged once this
# [extend] block was added, using gitleaks' own default ruleset).
[extend]
useDefault = true

[allowlist]
description = "Narrow public fixture and frozen-checksum patterns; no path-wide exclusions"
regexes = [
  '''idem_[a-z0-9]{24}''',
  '''idem_abc123xyz[a-z0-9]*''',
  # Deterministic verification-mesh test fixture idempotency key, reused
  # identically across packages/verification/fixtures/candidates/*.json
  # and packages/verification/src/tests/fixtures.ts — a fixture literal,
  # never a real idempotency key issued by any live system.
  '''idk_verificationfixture01aaa''',
  # One public SHA-256 contract artifact checksum in the frozen SUN-0102
  # report is classified by the generic-api-key rule. Allow only this exact
  # immutable checksum rather than excluding the report (or all hashes).
  '''61f3ace1dd8b786cda5821a48f812345a55253e31c20538834c185752a889d86''',
  # Circle's official Base Sepolia USDC ERC-20 contract address (public,
  # verifiable on BaseScan) — a public token address, not a secret. The
  # generic-api-key rule matches it when it appears as an object-literal
  # field value (packages/protocol-nevermined/src/checkpoint-fixture.ts);
  # the same literal elsewhere in the repo as a bare const isn't flagged,
  # confirming this is a match-context false positive, not a real secret.
  '''0x036CbD53842c5426634e7929541eC2318f3dCF7e''',
  # SUN-1222B-S2: Circle's official Base MAINNET USDC ERC-20 contract
  # address (public, verifiable on BaseScan) — the actual asset SITEBORNE
  # is configured to receive payment in. Proven non-secret and canonical
  # by cross-reference against source: it is the literal `EXPECTED_ASSET`
  # constant asserted in apps/edge-api/src/control-plane/production/
  # verify-agent-output-v2-cdp-composition.domain-metadata.test.ts and
  # web-context-v2-cdp-composition.test.ts, i.e. the same value the
  # production executors are actually configured to require — appearing
  # in forensic evidence docs (SUN-1220O, SUN-1222B) purely as a quoted
  # "matches authorized USDC asset" confirmation, never as key material.
  # Same false-positive class as the Sepolia entry above, extended to
  # mainnet now that mainnet forensic evidence exists.
  '''0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913''',
  # SUN-1222B-S2: two internal payment/idempotency correlation IDs quoted
  # verbatim in frozen forensic evidence reports (SUN-1221E2R, SUN-1221E6R-
  # H2B2). Proven non-secret: grep of apps/edge-api/src/control-plane/
  # continuation/idempotency-keys.ts and the D1 payment-attempts repository
  # shows `paymentIdentifier` is used only to derive D1 dedup/lookup keys —
  # never as a bearer credential, never sufficient on its own to authorize,
  # forge, or replay a settlement (that authority is the EIP-3009-signed
  # authorization payload, a wholly separate value never captured in these
  # reports). Allowlisted as two exact one-off values, not a `pay_[a-z0-9]+`
  # pattern, so a real credential that happens to share the prefix is still
  # caught.
  '''pay_5b90677d6a7d4a178bec037e21409e22''',
  '''pay_eb7a027d441448c5b9f5d707e20df776''',
  # `PrivateEs256Jwk` is a TypeScript TYPE NAME (SUN-0800B checkpoint 2,
  # packages/protocol-a2a/src/signing.ts — the production Agent Card
  # signing key structural-validation boundary), never a value. The
  # generic-api-key rule matches it purely because it appears immediately
  # after `privateKeyJwk:` in a parameter type annotation — no key
  # material, no literal secret, present at all on that line.
  '''PrivateEs256Jwk''',
]
